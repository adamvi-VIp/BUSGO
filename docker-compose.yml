version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY:-}
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - TZ=Europe/Prague
    restart: unless-stopped
    networks:
      - busgo-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - TZ=Europe/Prague
      - PORT=3001
    # This line makes the .env file available to the container
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - busgo-network

networks:
  busgo-network:
    driver: bridge
