<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
  <meta name="screen-orientation" content="portrait" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BusGo - Real-time Bus Departures</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png">
  <link rel="manifest" href="/manifest.json">
  <style>
    /* Ensure html-splash fill transition is smooth */
    #html-splash-fill {
      transition: clip-path 1.2s cubic-bezier(0.77, 0, 0.175, 1);
    }
  </style>
</head>

<body>
  <div id="html-splash"
    style="position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 0.5s;">
    <div style="position:relative;width:260px;height:100px;">
      <!-- Outline Text -->
      <span
        style="font-family:'Onest',Inter,sans-serif;font-weight:900;font-size:64px;letter-spacing:-2px;color:transparent;-webkit-text-stroke:2px #fff;text-stroke:2px #fff;position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:2;user-select:none;">BusGo</span>
      <!-- Blue Fill -->
      <span id="html-splash-fill"
        style="font-family:'Onest',Inter,sans-serif;font-weight:900;font-size:64px;letter-spacing:-2px;color:#2563eb;-webkit-text-stroke:2px #fff;text-stroke:2px #fff;position:absolute;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:1;user-select:none;overflow:hidden;clip-path:inset(100% 0 0 0);transition:clip-path 1.2s cubic-bezier(0.77,0,0.175,1);">BusGo</span>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(console.error);
      });
    }
    // Use the same isStandalone logic as in App.jsx
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (isStandalone) {
      document.getElementById('html-splash').style.paddingBottom = '2rem';
    }
  </script>
</body>

</html>
